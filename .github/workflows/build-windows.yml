name: Build Windows Executable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build executable
      # OJO: En Windows se usa ";" para separar carpetas en --add-data, a diferencia de Mac que usa ":"
      run: |
        pyinstaller --windowed --noconfirm --name "Sindicato Descuentos" --collect-all customtkinter --add-data "db/schema.sql;db" main.py
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sindicato-Descuentos-Windows
        path: dist/Sindicato Descuentos/
